<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Studio — A4 Baskı & Tablo Boyutlandırıcı</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: rgba(28, 28, 30, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #2997ff;
      --accent-hover: #0077ed;
      --text: #f5f5f7;
      --text-muted: #86868b;
      --input-bg: rgba(44, 44, 46, 0.6);
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      overflow-x: hidden;
    }

    /* Apple-Style Ambience Glow */
    .glow {
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 400px;
      background: radial-gradient(circle, rgba(41, 151, 255, 0.15) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .app-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1040px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* Minimalist Header */
    header {
      text-align: center;
      margin-bottom: 8px;
    }

    header h1 {
      font-size: 44px;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(180deg, #ffffff 40%, #a1a1a6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p {
      font-size: 17px;
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: -0.01em;
    }

    /* Apple Glass Card */
    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
    }

    /* Controls Layout */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      align-items: end;
    }

    .input-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-col.full-w {
      grid-column: span 4;
    }

    label {
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    /* Upload Zone */
    .upload-zone {
      border: 1px dashed rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.02);
      border-radius: var(--radius-md);
      padding: 28px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .upload-zone:hover {
      border-color: var(--accent);
      background: rgba(41, 151, 255, 0.04);
    }

    .upload-zone input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-text {
      font-size: 15px;
      color: var(--text);
      font-weight: 500;
    }

    .upload-subtext {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Sleek Inputs */
    input[type="number"], select {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 15px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
      font-weight: 500;
    }

    input[type="number"]:focus, select:focus {
      border-color: var(--accent);
    }

    /* Apple Buttons */
    .actions-row {
      grid-column: span 4;
      display: flex;
      gap: 14px;
      margin-top: 8px;
    }

    .btn {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      padding: 13px 20px;
      border-radius: 980px;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    /* Metric Summary Bar */
    .summary-strip {
      display: flex;
      justify-content: space-around;
      padding-top: 24px;
      margin-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .metric {
      text-align: center;
    }

    .metric-value {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }

    .metric-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Preview Canvas Area */
    .preview-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .preview-title {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .preview-title h3 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }

    .badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 980px;
      background: rgba(41, 151, 255, 0.12);
      color: var(--accent);
      font-weight: 600;
      border: 1px solid rgba(41, 151, 255, 0.25);
    }

    #grid-preview {
      display: inline-grid;
      gap: 16px;
      background: rgba(0, 0, 0, 0.4);
      padding: 24px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.06);
      max-width: 100%;
      overflow-x: auto;
    }

    .preview-card {
      background: #ffffff;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
      transition: transform 0.2s ease;
    }

    .preview-card:hover {
      transform: translateY(-2px);
    }

    .preview-card canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .card-label {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 4px;
      letter-spacing: 0.02em;
    }

    /* Print Specs */
    @media print {
      body {
        background: #fff !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .glow, .app-container {
        display: none !important;
      }
      #print-mount, #print-mount * {
        visibility: visible !important;
      }
      #print-mount {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .page-sheet {
        width: 210mm;
        height: 297mm;
        page-break-after: always;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .page-sheet canvas {
        width: 210mm;
        height: 297mm;
        display: block;
      }
      @page {
        size: A4 portrait;
        margin: 0;
      }
    }

    @media (max-width: 768px) {
      .controls-grid {
        grid-template-columns: 1fr 1fr;
      }
      .input-col.full-w, .actions-row {
        grid-column: span 2;
      }
    }
  </style>
</head>
<body>

<div class="glow"></div>

<div class="app-container">
  <header>
    <h1>Canvas Studio</h1>
    <p>Orijinal oranı koru. Tablo ölçünü gir. Kusursuz A4 çıktısı al.</p>
  </header>

  <div class="glass-panel">
    <div class="controls-grid">
      <div class="input-col full-w">
        <label>Görsel</label>
        <div class="upload-zone" id="dropZone">
          <input type="file" id="fileInput" accept="image/*">
          <div class="upload-text" id="uploadLabel">Fotoğrafı sürükle veya seç</div>
          <div class="upload-subtext">JPG, PNG veya WEBP</div>
        </div>
      </div>

      <div class="input-col">
        <label>Genişlik (cm)</label>
        <input type="number" id="frameW" value="50" min="5" step="0.5">
      </div>

      <div class="input-col">
        <label>Yükseklik (cm)</label>
        <input type="number" id="frameH" value="70" min="5" step="0.5">
      </div>

      <div class="input-col">
        <label>Ölçek Kilidi</label>
        <select id="fitEdge">
          <option value="width">Genişliği Sabitle</option>
          <option value="height">Yüksekliği Sabitle</option>
          <option value="fitInside">İçine Sığdır</option>
        </select>
      </div>

      <div class="input-col">
        <label>Kesim Payı (cm)</label>
        <input type="number" id="marginCm" value="1.0" min="0" max="3" step="0.5">
      </div>

      <div class="actions-row">
        <button class="btn btn-primary" onclick="generate()">Hesapla & Önizle</button>
        <button class="btn btn-secondary" onclick="window.print()">Baskı Al / PDF</button>
      </div>
    </div>

    <div class="summary-strip">
      <div class="metric">
        <div class="metric-value" id="resTarget">—</div>
        <div class="metric-label">Sonuç Ölçüsü</div>
      </div>
      <div class="metric">
        <div class="metric-value" id="resPages">—</div>
        <div class="metric-label">A4 Sayfası</div>
      </div>
      <div class="metric">
        <div class="metric-value" id="resGrid">—</div>
        <div class="metric-label">Dizilim (Sütun × Satır)</div>
      </div>
    </div>
  </div>

  <div class="glass-panel preview-container">
    <div class="preview-title">
      <h3>Baskı Kılavuzu</h3>
      <span class="badge" id="previewBadge">Hazır</span>
    </div>
    <div id="grid-preview">
      <div style="color: var(--text-muted); font-size: 14px; padding: 40px;">Fotoğraf yüklendiğinde A4 sayfaları burada listelenecektir.</div>
    </div>
  </div>
</div>

<div id="print-mount"></div>

<script>
  const A4_W = 21.0;
  const A4_H = 29.7;
  const PX_PER_CM = 118.11; // 300 DPI standardı

  let imgInstance = null;

  const fileInput = document.getElementById('fileInput');
  const uploadLabel = document.getElementById('uploadLabel');

  fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    uploadLabel.innerText = file.name;
    const reader = new FileReader();
    reader.onload = function(evt) {
      imgInstance = new Image();
      imgInstance.onload = generate;
      imgInstance.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  });

  function generate() {
    if (!imgInstance) {
      alert("Lütfen önce bir fotoğraf seçin.");
      return;
    }

    const frameW = parseFloat(document.getElementById('frameW').value);
    const frameH = parseFloat(document.getElementById('frameH').value);
    const fitEdge = document.getElementById('fitEdge').value;
    const marginCm = parseFloat(document.getElementById('marginCm').value) || 0;

    const printW = A4_W - (marginCm * 2);
    const printH = A4_H - (marginCm * 2);

    const aspect = imgInstance.width / imgInstance.height;
    let finalW, finalH;

    if (fitEdge === 'width') {
      finalW = frameW;
      finalH = frameW / aspect;
    } else if (fitEdge === 'height') {
      finalH = frameH;
      finalW = frameH * aspect;
    } else {
      if ((frameW / frameH) > aspect) {
        finalH = frameH;
        finalW = frameH * aspect;
      } else {
        finalW = frameW;
        finalH = frameW / aspect;
      }
    }

    const cols = Math.ceil(finalW / printW);
    const rows = Math.ceil(finalH / printH);
    const totalPages = cols * rows;

    document.getElementById('resTarget').innerText = `${finalW.toFixed(1)} × ${finalH.toFixed(1)} cm`;
    document.getElementById('resPages').innerText = `${totalPages} Adet`;
    document.getElementById('resGrid').innerText = `${cols} × ${rows}`;
    document.getElementById('previewBadge').innerText = `${cols} Sütun × ${rows} Satır`;

    const mainCanvas = document.createElement('canvas');
    mainCanvas.width = Math.round(finalW * PX_PER_CM);
    mainCanvas.height = Math.round(finalH * PX_PER_CM);
    const mCtx = mainCanvas.getContext('2d');
    mCtx.drawImage(imgInstance, 0, 0, imgInstance.width, imgInstance.height, 0, 0, mainCanvas.width, mainCanvas.height);

    const grid = document.getElementById('grid-preview');
    const printMount = document.getElementById('print-mount');
    grid.innerHTML = '';
    printMount.innerHTML = '';

    const colWidthPx = 130;
    grid.style.gridTemplateColumns = `repeat(${cols}, ${colWidthPx}px)`;

    const a4PxW = Math.round(A4_W * PX_PER_CM);
    const a4PxH = Math.round(A4_H * PX_PER_CM);
    const marginPx = Math.round(marginCm * PX_PER_CM);
    const printPxW = Math.round(printW * PX_PER_CM);
    const printPxH = Math.round(printH * PX_PER_CM);

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const pageCanvas = document.createElement('canvas');
        pageCanvas.width = a4PxW;
        pageCanvas.height = a4PxH;
        const pCtx = pageCanvas.getContext('2d');

        pCtx.fillStyle = '#ffffff';
        pCtx.fillRect(0, 0, a4PxW, a4PxH);

        const srcX = c * printPxW;
        const srcY = r * printPxH;
        const srcW = Math.min(printPxW, mainCanvas.width - srcX);
        const srcH = Math.min(printPxH, mainCanvas.height - srcY);

        if (srcW > 0 && srcH > 0) {
          pCtx.drawImage(mainCanvas, srcX, srcY, srcW, srcH, marginPx, marginPx, srcW, srcH);
        }

        // Kırmızı Kesim Kılavuz Çizgileri
        pCtx.save();
        pCtx.strokeStyle = '#ff3b30';
        pCtx.lineWidth = 2;
        pCtx.setLineDash([8, 8]);
        if (srcW > 0 && srcH > 0) {
          pCtx.strokeRect(marginPx, marginPx, srcW, srcH);
        }

        pCtx.fillStyle = '#86868b';
        pCtx.font = '15px -apple-system, sans-serif';
        pCtx.fillText(`Sayfa ${r * cols + c + 1} (${r + 1}.${c + 1})`, marginPx, Math.max(22, marginPx - 8));
        pCtx.restore();

        // Kart Önizleme
        const card = document.createElement('div');
        card.className = 'preview-card';
        card.style.height = `${colWidthPx * (A4_H / A4_W)}px`;

        const prevCanvas = document.createElement('canvas');
        prevCanvas.width = a4PxW;
        prevCanvas.height = a4PxH;
        prevCanvas.getContext('2d').drawImage(pageCanvas, 0, 0);

        const lbl = document.createElement('div');
        lbl.className = 'card-label';
        lbl.innerText = `${r + 1}.${c + 1}`;

        card.appendChild(prevCanvas);
        card.appendChild(lbl);
        grid.appendChild(card);

        // Baskı Elemanı
        const sheet = document.createElement('div');
        sheet.className = 'page-sheet';
        sheet.appendChild(pageCanvas);
        printMount.appendChild(sheet);
      }
    }
  }
</script>
</body>
</html>
